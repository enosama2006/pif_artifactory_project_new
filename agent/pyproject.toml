[project]
name = "anonymizer-agent"
version = "0.1.0"
description = "Block-based document anonymization agent"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.29",
    "litellm>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
